name: Build Aeolus standalone

defaults:
  run:
    shell: bash

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - 'docs/**'
  push:
    branches:
      - master
    paths-ignore:
      - 'docs/**'

env:
  type: Release
  dir_build: ./build
  dir_source: .

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
            generator: Unix Makefiles
            path: ./build/Aeolus_artefacts/Release
            asio: OFF
          - os: ubuntu-22.04-arm
            ipo: ON
            name: linux-arm64
            generator: Unix Makefiles
            path: ./build/Aeolus_artefacts/Release
            asio: OFF
          - os: macos-latest
            name: mac
            generator: Unix Makefiles
            path: ./build/Aeolus_artefacts/Release
            asio: OFF
          - os: windows-2022
            name: win
            generator: Visual Studio 17 2022
            path: ./build/Aeolus_artefacts/Release
            asio: ON

    steps:
    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install ninja-build libx11-dev libfreetype-dev libfontconfig-dev libasound2-dev libxrandr-dev libxinerama-dev libxcursor-dev libgl1-mesa-dev xvfb

    - name: Install macOS dependencies
      if: matrix.os == 'macos-latest'
      run: brew install ninja

    - name: Install Windows dependencies
      if: matrix.os == 'windows-2022'
      run: choco install ninja

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Download ASIO SDK
      if: matrix.os == 'windows-2022'
      shell: cmake -P {0}
      env:
        ASIOSDK_URL: 'https://download.steinberg.net/sdk_downloads/asiosdk_2.3.3_2019-06-14.zip'
      run: |
        file(DOWNLOAD $ENV{ASIOSDK_URL} $ENV{GITHUB_WORKSPACE}/asiosdk.zip)
        execute_process(COMMAND 7z x $ENV{GITHUB_WORKSPACE}/asiosdk.zip -o$ENV{GITHUB_WORKSPACE})

    - name: Build plugin
      run: |
        cmake \
          -G "${{ matrix.generator }}" \
          -DWITH_ASIO=${{ matrix.asio }} \
          -DAEOLUS_BUILD_TESTS=ON \
          -DAEOLUS_ENABLE_IPO=${{ matrix.ipo || 'OFF' }} \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
          -S "${{ env.dir_source }}" \
          -B "${{ env.dir_build }}"
        cmake --build "${{ env.dir_build }}" --config "${{ env.type }}" --parallel 2

    - name: Run regression tests (Linux)
      if: runner.os == 'Linux'
      run: xvfb-run -a ctest --test-dir "${{ env.dir_build }}" -C Release --output-on-failure

    - name: Measure spatial block processing (Linux)
      if: runner.os == 'Linux'
      run: xvfb-run -a "${{ env.dir_build }}/aeolus_tests" --benchmark-spatial

    - name: Run regression tests (macOS / Windows)
      if: runner.os != 'Linux'
      run: ctest --test-dir "${{ env.dir_build }}" -C Release --output-on-failure

    - name: Inspect Linux executable
      if: runner.os == 'Linux'
      run: |
        file "${{ matrix.path }}/Standalone/Aeolus"
        ldd "${{ matrix.path }}/Standalone/Aeolus" | tee /tmp/aeolus-libraries.txt
        if grep -q "not found" /tmp/aeolus-libraries.txt; then exit 1; fi

    - name: Collect license and asset notices
      run: |
        python - <<'PYTHON'
        from pathlib import Path
        import shutil
        destination = Path("${{ matrix.path }}") / "Notices"
        destination.mkdir(parents=True, exist_ok=True)
        for name in ("LICENSE.txt", "NOTICE.md", "THIRD_PARTY_NOTICES.md"):
            shutil.copy2(name, destination / name)
        shutil.copytree("LICENSES", destination / "LICENSES", dirs_exist_ok=True)
        (destination / "docs").mkdir(exist_ok=True)
        for name in ("ASSET_NOTICES.md", "asset-provenance.json", "DISTRIBUTION_CHECKLIST.md"):
            shutil.copy2(Path("docs") / name, destination / "docs" / name)
        PYTHON

    - name: Record build provenance
      env:
        AEOLUS_IPO: ${{ matrix.ipo || 'OFF' }}
      run: |
        python - <<'PYTHON'
        import json, os, platform, subprocess
        from pathlib import Path
        info = {"commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
                "architecture": platform.machine(), "ipo": os.environ["AEOLUS_IPO"],
                "configuration": "Release", "runner": "${{ matrix.os }}"}
        (Path("${{ matrix.path }}") / "BuildInfo.json").write_text(json.dumps(info, indent=2) + "\n")
        PYTHON

    - name: List errors
      run: cat "${{ env.dir_build }}/CMakeFiles/CMakeError.log" || true

    - name: List files generated
      run: |
        cd ${{ matrix.path }}
        find "$(pwd)"

    - uses: actions/upload-artifact@v4
      with:
        name: aeolus-${{ matrix.name }}
        path: |
          ${{ matrix.path }}/BuildInfo.json
          ${{ matrix.path }}/Notices
          ${{ matrix.path }}/Standalone
          ${{ matrix.path }}/AU
          ${{ matrix.path }}/LV2
          ${{ matrix.path }}/CLAP
          !${{ matrix.path }}/CLAP/*.exp
          !${{ matrix.path }}/CLAP/*.lib
          ${{ matrix.path }}/VST3
          !${{ matrix.path }}/VST3/*.exp
          !${{ matrix.path }}/VST3/*.lib
        if-no-files-found: ignore
